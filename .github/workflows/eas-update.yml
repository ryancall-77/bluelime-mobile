name: EAS Update (OTA)

# Ships an over-the-air JS update to the "preview" channel automatically on every
# push to main (i.e. whenever a mobile change is merged), and on manual dispatch.
# Testers get it on the next app relaunch — no rebuild, no local commands.
#
# One-time setup: add an EXPO_TOKEN repo secret
# (Expo dashboard → Account → Access tokens → create a token, then
#  GitHub → Settings → Secrets and variables → Actions → New repository secret).
#
# NOTE: OTA updates only apply when the native runtime is unchanged. If a PR adds
# or upgrades a native module, run the "EAS Build" workflow instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message shown in EAS'
        required: false
        default: 'Manual OTA update'
      channel:
        description: 'EAS channel to publish to (preview | production)'
        required: false
        default: 'preview'
      runtime_version:
        description: >-
          Pin an explicit runtimeVersion instead of the fingerprint policy.
          Use the runtime of the INSTALLED build (npx eas build:list) when an
          update must reach a build whose CI-computed fingerprint has drifted.
          Leave blank for normal fingerprint behaviour.
        required: false
        default: ''

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        # EXPO_PUBLIC_* vars are inlined into the JS bundle AT PUBLISH TIME, and
        # eas.json's build-profile `env` blocks apply to `eas build` only, NOT to
        # `eas update` — omit them and the OTA ships an empty Supabase config
        # ("Supabase isn't configured", login button dead).
        #
        # They used to be hardcoded here with a "keep these in sync with eas.json"
        # comment. They did not stay in sync: this block still said
        # EXPO_PUBLIC_API_BASE=https://bluelime.ai months after eas.json moved every
        # profile to https://realtyzoom.com, so every CI OTA pointed the app at the
        # wrong host (found 2026-08-18). Two copies of one fact drift; a comment
        # asking a human to sync them is not a mechanism.
        #
        # They now live ONCE, as EAS project environment variables (production +
        # preview, plaintext — all client-safe publishable values, no secrets), and
        # `--environment preview` below pulls them in. Change them with
        # `eas env:update`, and mirror into eas.json's build profiles only because
        # `eas build` reads those instead. Verify any publish by grepping the
        # exported bundle for the project ref, never by reading the workflow.
        env:
          # Passed as env, NOT interpolated into the script body: `${{ }}` is a raw
          # TEXT substitution, so a commit message containing parentheses, quotes or
          # newlines produced a shell syntax error and failed the publish (it was also
          # a script-injection vector). Env vars are set by the runner, never parsed.
          INPUT_MSG: ${{ github.event.inputs.message }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_RUNTIME: ${{ github.event.inputs.runtime_version }}
        run: |
          MSG="${INPUT_MSG:-$COMMIT_MSG}"
          # EAS wants a short one-liner — take the subject line and cap the length.
          MSG="$(printf '%s' "$MSG" | head -n 1 | cut -c1-180)"
          if [ -z "$MSG" ]; then MSG="OTA update"; fi
          CH="${INPUT_CHANNEL:-preview}"

          # ── Optional runtime pin ────────────────────────────────────────────
          # ⚠️ Injected HERE, at run time, and NEVER committed to app.json.
          # app.json is a fingerprint input: committing an explicit runtime would
          # pin every future `eas build` to it. This edit lives only in the
          # runner's throwaway checkout.
          #
          # Why this exists: on 2026-09-03 the live build (build 2, 2026-08-14)
          # had runtime 4f563724…, while every CI publish computed a DIFFERENT
          # fingerprint (8e734012…, then 91a75198…). `eas build` fingerprints on
          # the build machine after prebuild; `eas update` fingerprints in CI, and
          # the two had silently forked with no tracked config change. Result:
          # every OTA from 2026-08-14 onward published green and reached nobody.
          # Pinning to the installed build's runtime is what lets a JS-only change
          # reach an existing binary without paying for a new build.
          #
          # ONLY safe while no native dependency has changed since that build —
          # check `git diff <build-commit>..HEAD -- package.json package-lock.json`
          # is empty first, or the bundle will reference native modules the binary
          # does not have.
          if [ -n "$INPUT_RUNTIME" ]; then
            echo "Pinning runtimeVersion to $INPUT_RUNTIME (run-time only)"
            # Surgical, not a JSON round-trip: a serializer would reformat the
            # file, and reformatting a fingerprint-input file has broken this
            # repo's OTA before.
            python3 - "$INPUT_RUNTIME" <<'PYEOF'
          import io, re, sys
          rt = sys.argv[1]
          p = 'app.json'
          s = io.open(p, encoding='utf-8', newline='').read()
          pat = re.compile(r'"runtimeVersion"\s*:\s*\{[^}]*\}')
          if not pat.search(s):
              raise SystemExit('runtimeVersion policy block not found in app.json')
          io.open(p, 'w', encoding='utf-8', newline='').write(
              pat.sub('"runtimeVersion": "%s"' % rt, s, count=1))
          print('pinned', rt)
          PYEOF
          fi
          # iOS only: --platform=all would also web-export, and Expo Router's
          # web static render evaluates native-only modules (secureStore/supabase)
          # under Node and crashes. This is an iPhone app, so publish iOS.
          #
          # ⚠️ --channel, NOT --branch. The CHANNEL is what the installed binary
          # listens to (baked in by eas.json's build profile at build time);
          # a branch is just a name that a channel points at. Until 2026-09-03
          # this line was hardcoded to `--branch preview` while the only live
          # build was built on the `production` channel — nothing was mapped to
          # production, so every publish went where nothing was listening.
          #
          # ⚠️ They are MUTUALLY EXCLUSIVE — passing both fails with "Cannot
          # specify both --channel and --branch". Publishing by channel lets EAS
          # resolve/point the branch itself, which is what we want.
          #
          # Verify a publish against `eas build:list` (channel AND
          # runtimeVersion), never against a previous OTA: CI publishes agree
          # with each other and can all be wrong together.
          eas update --channel "$CH" --environment "$CH" --platform ios --message "$MSG" --non-interactive
