name: EAS Update (OTA)

# Ships an over-the-air JS update to the "preview" channel automatically on every
# push to main (i.e. whenever a mobile change is merged), and on manual dispatch.
# Testers get it on the next app relaunch — no rebuild, no local commands.
#
# One-time setup: add an EXPO_TOKEN repo secret
# (Expo dashboard → Account → Access tokens → create a token, then
#  GitHub → Settings → Secrets and variables → Actions → New repository secret).
#
# NOTE: OTA updates only apply when the native runtime is unchanged. If a PR adds
# or upgrades a native module, run the "EAS Build" workflow instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message shown in EAS'
        required: false
        default: 'Manual OTA update'

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        # EXPO_PUBLIC_* vars are inlined into the JS bundle AT PUBLISH TIME, and
        # eas.json's build-profile `env` blocks apply to `eas build` only, NOT to
        # `eas update` — omit them and the OTA ships an empty Supabase config
        # ("Supabase isn't configured", login button dead).
        #
        # They used to be hardcoded here with a "keep these in sync with eas.json"
        # comment. They did not stay in sync: this block still said
        # EXPO_PUBLIC_API_BASE=https://bluelime.ai months after eas.json moved every
        # profile to https://realtyzoom.com, so every CI OTA pointed the app at the
        # wrong host (found 2026-08-18). Two copies of one fact drift; a comment
        # asking a human to sync them is not a mechanism.
        #
        # They now live ONCE, as EAS project environment variables (production +
        # preview, plaintext — all client-safe publishable values, no secrets), and
        # `--environment preview` below pulls them in. Change them with
        # `eas env:update`, and mirror into eas.json's build profiles only because
        # `eas build` reads those instead. Verify any publish by grepping the
        # exported bundle for the project ref, never by reading the workflow.
        env:
          # Passed as env, NOT interpolated into the script body: `${{ }}` is a raw
          # TEXT substitution, so a commit message containing parentheses, quotes or
          # newlines produced a shell syntax error and failed the publish (it was also
          # a script-injection vector). Env vars are set by the runner, never parsed.
          INPUT_MSG: ${{ github.event.inputs.message }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="${INPUT_MSG:-$COMMIT_MSG}"
          # EAS wants a short one-liner — take the subject line and cap the length.
          MSG="$(printf '%s' "$MSG" | head -n 1 | cut -c1-180)"
          if [ -z "$MSG" ]; then MSG="OTA update"; fi
          # iOS only: --platform=all would also web-export, and Expo Router's
          # web static render evaluates native-only modules (secureStore/supabase)
          # under Node and crashes. This is an iPhone app, so publish iOS.
          eas update --branch preview --environment preview --platform ios --message "$MSG" --non-interactive
