name: EAS Submit (TestFlight)

# Submits an already-finished EAS build to TestFlight.
#
# Why this exists: `eas submit` can't be run from a local Claude Code session
# (the sandbox classifier blocks it), same as `eas build` — which is what
# eas-build.yml already works around. Without this, every TestFlight push had to
# be done by hand. Manual dispatch only; nothing here fires on push.
#
# Uses the ascAppId + ASC API key already configured in eas.json's
# submit.production.ios, so no prompts. TestFlight internal testing needs no
# App Store review — do NOT click "Add for Review" on the version page, that's
# a public release.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build id to submit (blank = most recent finished build)'
        required: false
        type: string
      platform:
        description: 'Platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas.json points ascApiKeyPath at a Windows path that doesn't exist on the
      # runner. Two ways forward, tried in order so this needs no human step
      # whenever Expo already holds the key:
      #   1. ASC_API_KEY_P8 repo secret -> materialise it and repoint eas.json
      #   2. no secret -> STRIP ascApiKeyPath so EAS falls back to the App Store
      #      Connect API key stored in Expo's own credential service
      - name: Resolve App Store Connect credentials
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          # ascAppId is injected here, NOT stored in eas.json: eas.json feeds the
          # expo-updates fingerprint, so adding a field there changes the runtime
          # version and silently orphans every installed app from OTA updates.
          node -e '
            const fs=require("fs"), p="eas.json";
            const j=JSON.parse(fs.readFileSync(p,"utf8"));
            j.submit.production.ios.ascAppId="6790447988";
            fs.writeFileSync(p,JSON.stringify(j,null,2));
          '
          if [ -n "$ASC_KEY_P8" ]; then
            mkdir -p "$HOME/asc"
            printf '%s' "$ASC_KEY_P8" > "$HOME/asc/AuthKey.p8"
            node -e '
              const fs=require("fs"), p="eas.json";
              const j=JSON.parse(fs.readFileSync(p,"utf8"));
              j.submit.production.ios.ascApiKeyPath=process.env.HOME+"/asc/AuthKey.p8";
              fs.writeFileSync(p,JSON.stringify(j,null,2));
            '
            echo "Using ASC key from repo secret."
          else
            node -e '
              const fs=require("fs"), p="eas.json";
              const j=JSON.parse(fs.readFileSync(p,"utf8"));
              // EAS requires ascApiKeyPath + ascApiKeyId + ascApiKeyIssuerId
              // together or not at all — deleting only the path leaves an
              // invalid partial config and it refuses to run.
              delete j.submit.production.ios.ascApiKeyPath;
              delete j.submit.production.ios.ascApiKeyId;
              delete j.submit.production.ios.ascApiKeyIssuerId;
              fs.writeFileSync(p,JSON.stringify(j,null,2));
            '
            echo "No ASC_API_KEY_P8 secret - falling back to credentials stored on Expo."
          fi

      - name: Submit
        run: |
          ID_ARG="--latest"
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            ID_ARG="--id ${{ github.event.inputs.build_id }}"
          fi
          eas submit -p ${{ github.event.inputs.platform }} --profile production $ID_ARG --non-interactive
