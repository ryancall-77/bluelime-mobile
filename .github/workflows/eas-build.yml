name: EAS Build

# Kicks off a native EAS build (for when a PR adds/changes a native module, so an
# OTA update isn't enough). Manual only — trigger it from the Actions tab's
# "Run workflow" button, or ask Logan to trigger it. Uses --no-wait so the job
# returns immediately; watch progress in the Expo dashboard.
#
# One-time setup: same EXPO_TOKEN repo secret as the EAS Update workflow.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: 'eas.json build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start EAS build
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
